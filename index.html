<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --b900:#12332570; --b800:#173c2c; --b700:#1f5c42; --b600:#2b7551; --b500:#3d9068;
    --b400:#5aab82; --b200:#bfe0cd; --b100:#e4f3ea; --b50:#f6faf7;
    --danger:#b3452f; --danger-bg:#fdf0ee; --warn:#93630f; --warn-bg:#fbf1e2;
    --ink:#1c2622; --muted:#78716c; --muted2:#a8a29e; --border:#f1efe9;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; color:var(--ink); background:#fbfaf7;}
  .serif{font-family:'Fraunces',serif;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px;}
  a{color:inherit;}

  .btn{display:inline-flex; align-items:center; gap:6px; justify-content:center; border:none; border-radius:10px; padding:9px 14px; font-size:14px; font-weight:500; transition:transform .05s ease;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.6; cursor:default;}
  .btn-primary{background:var(--b600); color:#fff;}
  .btn-primary:hover{background:var(--b700);}
  .btn-outline{background:#fff; color:var(--b700); border:1px solid var(--b200);}
  .btn-outline:hover{background:var(--b50);}
  .btn-danger{background:var(--danger-bg); color:var(--danger);}
  .btn-danger:hover{filter:brightness(0.97);}
  .btn-ghost{background:transparent; color:var(--b700);}
  .icon-btn{padding:6px; border-radius:8px; border:none; background:transparent; display:inline-flex;}
  .icon-btn:hover{background:#f5f4f0;}
  .icon-btn.danger:hover{background:var(--danger-bg); color:var(--danger);}

  .field{display:block; margin-bottom:12px;}
  .field-label{display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--b700); margin-bottom:4px;}
  .field-hint{display:block; font-size:11px; color:#a8a29e; margin-top:4px;}
  .input, select.input, textarea.input{
    width:100%; border:1px solid #e7e5e0; background:#fff; border-radius:8px; padding:9px 11px;
    outline:none; color:var(--ink); transition:box-shadow .1s;
  }
  .input:focus{box-shadow:0 0 0 3px var(--b100); border-color:var(--b400);}

  .card{background:#fff; border:1px solid var(--border); border-radius:16px;}

  .badge{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:2px 9px; font-size:11px; font-weight:600;}
  .badge-ok{background:var(--b100); color:var(--b700);}
  .badge-pending{background:var(--warn-bg); color:var(--warn);}
  .dot{width:6px; height:6px; border-radius:999px; display:inline-block;}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:#a8a29e; padding:11px 14px; border-bottom:1px solid var(--border);}
  tbody td{padding:11px 14px; border-bottom:1px solid #faf9f6;}
  tbody tr:hover{background:#fafaf8;}

  #root{min-height:100vh;}
  .app-shell{min-height:100vh; display:flex;}
  .sidebar{width:250px; flex-shrink:0; background:#fff; border-right:1px solid var(--border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
  .sidebar-brand{padding:22px 18px; border-bottom:1px solid var(--border); text-align:center;}
  .sidebar-nav{flex:1; padding:14px 10px; overflow-y:auto;}
  .nav-item{width:100%; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; border:none; background:transparent; color:#44544c; font-size:14px; font-weight:500; margin-bottom:3px; text-align:left;}
  .nav-item:hover{background:var(--b50);}
  .nav-item.active{background:var(--b600); color:#fff;}
  .nav-group-toggle.active-group{color:var(--b700); background:var(--b50);}
  .nav-subitems{padding-left:10px; margin-bottom:2px;}
  .nav-subitem{padding-left:22px; font-size:13.5px;}
  .sidebar-foot{padding:14px 16px; border-top:1px solid var(--border);}
  .avatar{width:32px; height:32px; border-radius:999px; background:var(--b500); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex-shrink:0;}
  main.view{flex:1; padding:28px 32px; min-width:0;}

  .stat-card{background:#fff; border:1px solid var(--border); border-radius:16px; padding:14px; display:flex; align-items:center; gap:12px;}
  .stat-icon{border-radius:12px; padding:9px; display:flex;}
  .stat-label{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:#a8a29e; font-weight:600; margin:0 0 2px;}
  .stat-value{font-size:17px; font-weight:600; color:#292524; margin:0;}

  .grid-4{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .grid-3{display:grid; grid-template-columns:1fr; gap:14px;}
  .grid-2{display:grid; grid-template-columns:1fr; gap:14px;}
  @media(min-width:900px){
    .grid-4{grid-template-columns:repeat(4,1fr);}
    .grid-3{grid-template-columns:repeat(3,1fr);}
    .grid-2{grid-template-columns:1fr 1fr;}
  }

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.32); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;}
  .modal{background:#fff; border-radius:18px; width:100%; max-width:460px; box-shadow:0 20px 50px rgba(0,0,0,.15); max-height:88vh; display:flex; flex-direction:column;}
  .modal.wide{max-width:640px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
  .modal-body{padding:20px; overflow-y:auto;}
  .confirm-box{background:#fff; border-radius:18px; width:100%; max-width:380px; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,.15);}

  .filter-bar{background:#fff; border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:16px; display:grid; grid-template-columns:1fr; gap:10px;}
  @media(min-width:900px){ .filter-bar{grid-template-columns:1.6fr .8fr .8fr 1fr 1fr .8fr;} }

  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--b50);}
  .login-box{width:100%; max-width:360px;}

  .empty{text-align:center; color:#a8a29e; padding:40px 10px; font-size:14px;}
  .muted{color:#a8a29e;}
  .list-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 16px; border-bottom:1px solid #faf9f6;}
  .list-row:last-child{border-bottom:none;}

  .toast{position:fixed; bottom:20px; right:20px; z-index:100; background:#292524; color:#fff; font-size:13px; padding:10px 16px; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.2); max-width:320px;}
  .toast.error{background:var(--danger);}
  .spinner{width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; display:inline-block; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

const DANGER = "#b3452f", DANGER_BG = "#fdf0ee", WARN = "#93630f", WARN_BG = "#fbf1e2";

const TIPO_LABEL = { entrada:"Entradas", saida:"Saídas", cartao:"Cartões e Débitos", vale:"Vales", fat_entrada:"Faturamentos — Entradas", fat_saida:"Faturamentos — Saídas" };
const catsFor = (tipo) => STATE.categorias.filter(c=>c.tipo===tipo).map(c=>c.nome);
const catsForFat = (tipo) => catsFor("fat_"+tipo);

const addMonths = (dateStr, n) => { const d = new Date(dateStr+"T00:00:00"); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); };
const splitValor = (total, n) => { const cents = Math.round(total*100); const base = Math.floor(cents/n); const resto = cents - base*n; const arr=[]; for(let i=0;i<n;i++){ arr.push((base + (i<resto?1:0))/100); } return arr; };

/* ============================== Helpers genéricos ============================== */
const todayISO = () => new Date().toISOString().slice(0,10);
const currency = (v) => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);
const fmtDate = (d) => { if(!d) return "—"; const [y,m,day]=d.split("-"); return `${day}/${m}/${y}`; };
const monthKey = (d) => d ? d.slice(0,7) : "";
const monthLabel = (ym) => { const [y,m]=ym.split("-"); const n=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"]; return `${n[parseInt(m,10)-1]}/${y.slice(2)}`; };
const lastNMonthKeys = (n) => { const arr=[]; const now=new Date(); for(let i=n-1;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); arr.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);} return arr; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, isError){
  const t = document.createElement("div");
  t.className = "toast" + (isError ? " error" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 4000);
}

/* ============================== Camada Supabase (fetch puro) ============================== */
async function sbAuthLogin(email, password){
  const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
    method:"POST",
    headers:{ apikey:SB_ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || data.error || "Não foi possível entrar. Verifique e-mail e senha.");
  return data;
}
async function sbAuthSignup(email, password){
  const res = await fetch(`${SB_URL}/auth/v1/signup`, {
    method:"POST",
    headers:{ apikey:SB_ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || data.error || "Não foi possível criar o usuário.");
  return data;
}
async function sbAuthRefresh(refresh_token){
  const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
    method:"POST",
    headers:{ apikey:SB_ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ refresh_token }),
  });
  const data = await res.json();
  if(!res.ok) throw new Error("sessão expirada");
  return data;
}
async function saveRefreshToken(token){ try{ if(token) await window.storage.set(REFRESH_KEY, token, false); else await window.storage.delete(REFRESH_KEY, false); }catch(e){} }
async function loadRefreshToken(){ try{ const r = await window.storage.get(REFRESH_KEY, false); return r ? r.value : null; }catch(e){ return null; } }

async function sbFetch(path, {method="GET", body, retry=true}={}){
  const doFetch = (token) => fetch(`${SB_URL}${path}`, {
    method,
    headers:{
      apikey: SB_ANON_KEY,
      Authorization: `Bearer ${token}`,
      "Content-Type":"application/json",
      ...(method!=="GET" ? {"Prefer":"return=representation"} : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });

  let res = await doFetch(STATE.session.access_token);
  if(res.status===401 && retry && STATE.session.refresh_token){
    try{
      const fresh = await sbAuthRefresh(STATE.session.refresh_token);
      STATE.session = {...STATE.session, ...fresh};
      await saveRefreshToken(fresh.refresh_token);
      res = await doFetch(STATE.session.access_token);
    }catch(e){
      STATE.session = null; STATE.currentUser = null;
      renderRoot();
      throw new Error("Sua sessão expirou. Faça login novamente.");
    }
  }
  if(res.status===204) return null;
  const data = await res.json().catch(()=>null);
  if(!res.ok) throw new Error((data && (data.message || data.error_description || data.msg)) || "Erro ao comunicar com o banco de dados.");
  return data;
}

const STATE = { loading:true, session:null, currentUser:null, users:[], lancamentos:[], cartaoLancamentos:[], valeLancamentos:[], faturamentoLancamentos:[], categorias:[], view:"dashboard", navOpen:{carteira:true, cartoes:true, vales:true, faturamento:true} };
const CHARTS = {};

async function bootstrap(){
  const refreshToken = await loadRefreshToken();
  if(refreshToken){
    try{
      const fresh = await sbAuthRefresh(refreshToken);
      STATE.session = fresh;
      await saveRefreshToken(fresh.refresh_token);
      await loadProfileAndData();
    }catch(e){
      await saveRefreshToken(null);
      STATE.session = null; STATE.currentUser = null;
    }
  }
  STATE.loading = false;
  renderRoot();
}

async function loadProfileAndData(){
  const profiles = await sbFetch(`/rest/v1/profiles?id=eq.${STATE.session.user.id}&select=*`);
  const profile = profiles && profiles[0];
  if(!profile) throw new Error("Perfil não encontrado.");
  STATE.currentUser = { id: STATE.session.user.id, email: STATE.session.user.email, nome: profile.nome, cargo: profile.cargo, permissoes: profile.permissoes || [] };
  await Promise.all([reloadLancamentos(), reloadCartaoLancamentos(), reloadValeLancamentos(), reloadFaturamentoLancamentos(), reloadCategorias(), isAdminLevel(STATE.currentUser) ? reloadUsers() : Promise.resolve()]);
  ajustarViewInicial();
}
function ajustarViewInicial(){
  if(temAcessoView(STATE.currentUser, STATE.view)) return;
  for(const g of NAV_GROUPS){
    for(const it of g.items){
      if(temAcessoView(STATE.currentUser, it.id)){ STATE.view = it.id; return; }
    }
  }
  STATE.view = "sem-acesso";
}

/* ---- Cartões e Débitos (carteira separada) ---- */
async function addCartaoCompra({ descricao, categoria, cartao, portador, valorTotal, parcelasTotal, dataPrimeira, observacao }){
  const compraId = crypto.randomUUID();
  const valores = splitValor(valorTotal, parcelasTotal);
  const rows = valores.map((valor, i) => ({
    compra_id: compraId, descricao, categoria, cartao, portador, valor,
    parcela_num: i+1, parcelas_total: parcelasTotal,
    data: addMonths(dataPrimeira, i), status:"previsto", observacao,
    usuario_id: STATE.currentUser.id, usuario_nome: STATE.currentUser.nome,
  }));
  const criados = await sbFetch(`/rest/v1/cartao_lancamentos`, { method:"POST", body: rows });
  STATE.cartaoLancamentos = [...criados, ...STATE.cartaoLancamentos].sort((a,b)=> b.data.localeCompare(a.data));
}
async function editCartaoLancamento(id, data){
  const [atualizado] = await sbFetch(`/rest/v1/cartao_lancamentos?id=eq.${id}`, { method:"PATCH", body:{...data, atualizado_em:new Date().toISOString()} });
  STATE.cartaoLancamentos = STATE.cartaoLancamentos.map(l=> l.id===id ? atualizado : l);
}

/* ---- Gerenciar categorias ---- */
function openCategoriasModal(tipo, onChanged){
  function bodyHTML(){
    const lista = STATE.categorias.filter(c=>c.tipo===tipo).sort((a,b)=>a.nome.localeCompare(b.nome));
    return `
      <form id="cat-add-form" style="display:flex;gap:8px;margin-bottom:14px;">
        <input class="input" id="cat-nova" placeholder="Nome da nova categoria" required />
        <button type="submit" class="btn btn-primary" style="flex-shrink:0;">${icon("plus",15)} Adicionar</button>
      </form>
      <div id="cat-list">
        ${lista.map(c=>`
          <div class="list-row" data-catrow="${c.id}">
            <span class="cat-nome" style="font-size:14px;color:#44403c;flex:1;">${esc(c.nome)}</span>
            <div style="display:flex;gap:2px;">
              <button class="icon-btn cat-edit-btn" data-id="${c.id}">${icon("edit",15,"#78716c")}</button>
              <button class="icon-btn danger cat-del-btn" data-id="${c.id}">${icon("trash",15,DANGER)}</button>
            </div>
          </div>`).join("") || `<p class="empty">Nenhuma categoria cadastrada ainda.</p>`}
      </div>
      <p class="field-hint" style="margin-top:10px;">Excluir uma categoria não altera lançamentos já criados com ela — só deixa de aparecer nas opções para novos lançamentos.</p>`;
  }

  function mount(body){
    body.querySelector("#cat-add-form").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const input = body.querySelector("#cat-nova");
      const nome = input.value.trim();
      if(!nome) return;
      try{
        await addCategoria(tipo, nome);
        body.innerHTML = bodyHTML(); mount(body);
        onChanged && onChanged();
      }catch(err){
        toast(/duplicate|unique/i.test(err.message) ? "Essa categoria já existe." : err.message, true);
      }
    });
    body.querySelectorAll(".cat-edit-btn").forEach(b=> b.addEventListener("click", ()=>{
      const row = body.querySelector(`[data-catrow="${b.dataset.id}"]`);
      const cat = STATE.categorias.find(c=>c.id===b.dataset.id);
      row.innerHTML = `
        <input class="input cat-edit-input" value="${esc(cat.nome)}" style="flex:1;" />
        <div style="display:flex;gap:2px;">
          <button class="icon-btn cat-save-btn">${icon("check",15,BRAND[600])}</button>
          <button class="icon-btn cat-cancelEdit-btn">${icon("x",15,"#78716c")}</button>
        </div>`;
      row.querySelector(".cat-save-btn").addEventListener("click", async ()=>{
        const novoNome = row.querySelector(".cat-edit-input").value.trim();
        if(!novoNome) return;
        try{
          await editCategoria(cat.id, novoNome);
          body.innerHTML = bodyHTML(); mount(body);
          onChanged && onChanged();
        }catch(err){
          toast(/duplicate|unique/i.test(err.message) ? "Essa categoria já existe." : err.message, true);
        }
      });
      row.querySelector(".cat-cancelEdit-btn").addEventListener("click", ()=>{ body.innerHTML = bodyHTML(); mount(body); });
    }));
    body.querySelectorAll(".cat-del-btn").forEach(b=> b.addEventListener("click", ()=>{
      const cat = STATE.categorias.find(c=>c.id===b.dataset.id);
      openConfirm(`Excluir a categoria "${cat.nome}"?`, async ()=>{
        try{
          await deleteCategoria(cat.id);
          body.innerHTML = bodyHTML(); mount(body);
          onChanged && onChanged();
        }catch(err){ toast(err.message, true); }
      });
    }));
  }

  openNestedModal({ title:`Categorias — ${TIPO_LABEL[tipo]}`, bodyHTML: bodyHTML(), mount });
}

  return `<button type="button" id="btn-gerenciar-cat" style="border:none;background:none;font-size:11px;color:${BRAND[600]};text-decoration:underline;cursor:pointer;padding:0;margin-top:5px;display:inline-flex;align-items:center;gap:3px;">${icon("edit",11)} Gerenciar categorias</button>`;

async function criarUsuario({ nome, email, senha, cargo, permissoes }){
  const data = await sbAuthSignup(email, senha);
  const newId = data.user && data.user.id;
  if(newId){
    const [perfil] = await sbFetch(`/rest/v1/profiles?id=eq.${newId}`, { method:"PATCH", body:{ nome, cargo, permissoes: permissoes||[] } });
    STATE.users = [...STATE.users, perfil].sort((a,b)=>a.nome.localeCompare(b.nome));
  }
  return data;
}
async function editarUsuario(id, { nome, cargo, permissoes }){
  const [perfil] = await sbFetch(`/rest/v1/profiles?id=eq.${id}`, { method:"PATCH", body:{ nome, cargo, permissoes: permissoes||[] } });
  STATE.users = STATE.users.map(u=> u.id===id ? perfil : u);
  if(STATE.currentUser && STATE.currentUser.id===id){
    STATE.currentUser = {...STATE.currentUser, nome: perfil.nome, cargo: perfil.cargo, permissoes: perfil.permissoes || [] };
  }
}

/* ============================== Modal / Confirm ============================== */
function closeModal(){ const m=document.getElementById("modal-overlay"); if(m) m.remove(); }
function openModal({title, wide, bodyHTML, mount}){
  closeModal();
  const div = document.createElement("div");
  div.id = "modal-overlay";
  div.className = "overlay";
  div.innerHTML = `
    <div class="modal ${wide?"wide":""}">
      <div class="modal-head">
        <h3 class="serif" style="margin:0;font-size:18px;color:${BRAND[800]}">${esc(title)}</h3>
        <button class="icon-btn" id="modal-close">${icon("x",18,"#78716c")}</button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
    </div>`;
  document.body.appendChild(div);
  div.addEventListener("mousedown", (e)=>{ if(e.target===div) closeModal(); });
  document.getElementById("modal-close").addEventListener("click", closeModal);
  if(mount) mount(div.querySelector(".modal-body"));
}
function closeNestedModal(){ const m=document.getElementById("nested-modal-overlay"); if(m) m.remove(); }
function openNestedModal({title, bodyHTML, mount}){
  closeNestedModal();
  const div = document.createElement("div");
  div.id = "nested-modal-overlay";
  div.className = "overlay";
  div.style.zIndex = "60";
  div.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h3 class="serif" style="margin:0;font-size:18px;color:${BRAND[800]}">${esc(title)}</h3>
        <button class="icon-btn" id="nested-modal-close">${icon("x",18,"#78716c")}</button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
    </div>`;
  document.body.appendChild(div);
  div.addEventListener("mousedown", (e)=>{ if(e.target===div) closeNestedModal(); });
  document.getElementById("nested-modal-close").addEventListener("click", closeNestedModal);
  if(mount) mount(div.querySelector(".modal-body"));
}
function closeConfirm(){ const c=document.getElementById("confirm-overlay"); if(c) c.remove(); }
function openConfirm(text, onConfirm){
  closeConfirm();
  const div = document.createElement("div");
  div.id = "confirm-overlay";
  div.className = "overlay";
  div.style.zIndex = "70";
  div.innerHTML = `
    <div class="confirm-box">
      <div style="display:flex;gap:12px;align-items:flex-start;">
        <div style="background:${DANGER_BG};color:${DANGER};border-radius:999px;padding:8px;">${icon("alert",18,DANGER)}</div>
        <p style="font-size:14px;color:#44403c;margin:4px 0 0;">${esc(text)}</p>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px;">
        <button class="btn btn-outline" id="confirm-cancel">Cancelar</button>
        <button class="btn btn-danger" id="confirm-ok">Excluir</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  document.getElementById("confirm-cancel").addEventListener("click", closeConfirm);
  document.getElementById("confirm-ok").addEventListener("click", ()=>{ closeConfirm(); onConfirm(); });
}

/* ============================== Root render ============================== */
function renderRoot(){
  const root = document.getElementById("root");
  if(STATE.loading){ root.innerHTML = `<div class="login-wrap"><p class="muted" style="font-size:14px;">Carregando...</p></div>`; return; }
  if(!STATE.currentUser){ renderLogin(root); return; }
  root.innerHTML = `
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="view" id="main-view"><div id="view-container"></div></main>
    </div>`;
  renderSidebar();
  renderView();
}

function brandMark(size){
  return `
    <div style="display:flex;flex-direction:column;align-items:center;">
      <img src="${P_ICON_B64}" alt="Paulu's" style="width:${size}px;height:auto;display:block;" />
      <span class="serif" style="margin-top:4px;font-size:22px;letter-spacing:.02em;color:${BRAND[600]};">Paulu's</span>
    </div>`;
}

function renderLogin(root){
  root.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <div style="text-align:center;margin-bottom:22px;">
          ${brandMark(60)}
          <p class="serif" style="font-style:italic;color:#78716c;margin-top:6px;font-size:14px;">Gestão Financeira</p>
        </div>
        <form id="login-form" class="card" style="padding:22px;">
          <label class="field">
            <span class="field-label">E-mail</span>
            <input class="input" id="li-user" type="email" placeholder="voce@empresa.com" autocomplete="username" autofocus />
          </label>
          <label class="field">
            <span class="field-label">Senha</span>
            <input class="input" id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
          </label>
          <p id="li-err" style="color:${DANGER};font-size:12px;display:none;margin:0 0 10px;"></p>
          <button class="btn btn-primary" style="width:100%;" type="submit" id="li-submit">Entrar</button>
        </form>
        <p class="muted" style="text-align:center;font-size:11px;margin-top:14px;">
          Acesso via Supabase — use o e-mail e senha cadastrados pelo administrador.
        </p>
      </div>
    </div>`;
  document.getElementById("login-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const email = document.getElementById("li-user").value.trim();
    const pass = document.getElementById("li-pass").value;
    const errEl = document.getElementById("li-err");
    const btn = document.getElementById("li-submit");
    errEl.style.display = "none";
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Entrando...`;
    try{
      const session = await sbAuthLogin(email, pass);
      STATE.session = session;
      await saveRefreshToken(session.refresh_token);

    }catch(err){

    }
  });
}

/* ============================== Perfis de acesso e permissões por aba/subaba ============================== */
const CARGO_LABEL = { usuario:"Usuário", admin:"Admin", super_admin:"Super Admin" };
function isAdminLevel(user){ return !!user && (user.cargo==="admin" || user.cargo==="super_admin"); }
function temAcessoView(user, viewId){
  if(!user || !viewId) return false;
  if(isAdminLevel(user)) return true;
  return Array.isArray(user.permissoes) && user.permissoes.includes(viewId);
}
function temAcessoGrupo(user, groupId){
  if(!user || !groupId) return false;
  if(isAdminLevel(user)) return true;
  const g = NAV_GROUPS.find(gr=>gr.id===groupId);
  if(!g) return false;
  return g.items.some(it=>temAcessoView(user, it.id));
}
function cargoBadge(cargo){
  const label = esc(CARGO_LABEL[cargo] || cargo);
  if(cargo==="super_admin") return `<span class="badge" style="background:${BRAND[800]};color:#fff;">${label}</span>`;
  if(cargo==="admin") return `<span class="badge badge-ok">${label}</span>`;
  return `<span class="badge badge-pending">${label}</span>`;
}
function permissoesBadges(u){
  if(isAdminLevel(u)) return `<span class="badge badge-ok"><span class="dot" style="background:${BRAND[500]}"></span>Acesso total</span>`;
  const perms = u.permissoes || [];
  const partes = [];
  NAV_GROUPS.forEach(g=>{
    const itensPermitidos = g.items.filter(it=>perms.includes(it.id));
    if(!itensPermitidos.length) return;
    if(itensPermitidos.length===g.items.length){
      partes.push(`<span class="badge badge-pending" style="margin:1px 4px 1px 0;">${esc(g.label)}</span>`);
    }else{
      partes.push(`<span class="badge badge-pending" style="margin:1px 4px 1px 0;" title="${esc(itensPermitidos.map(it=>it.label).join(", "))}">${esc(g.label)} (${itensPermitidos.length}/${g.items.length})</span>`);
    }
  });
  if(!partes.length) return `<span class="muted" style="font-size:12px;">Nenhum acesso liberado</span>`;
  return partes.join("");
}

function renderSidebar(){
  const sb = document.getElementById("sidebar");
  const prevNav = sb.querySelector(".sidebar-nav");
  const prevScrollTop = prevNav ? prevNav.scrollTop : 0;
  const groupHTML = NAV_GROUPS.map(g=>{
    const itensVisiveis = g.items.filter(it=>temAcessoView(STATE.currentUser, it.id));
    if(!itensVisiveis.length) return "";
    const open = !!STATE.navOpen[g.id];
    const hasActive = itensVisiveis.some(it=>it.id===STATE.view);
    return `
      <div class="nav-group">
        <button class="nav-item nav-group-toggle ${hasActive?"active-group":""}" data-group="${g.id}">
          ${icon(g.ic,17)} <span style="flex:1;text-align:left;">${esc(g.label)}</span>

        </button>
        <div class="nav-subitems" style="display:${open?"block":"none"};">
          ${itensVisiveis.map(it=>`
            <button class="nav-item nav-subitem ${STATE.view===it.id?"active":""}" data-view="${it.id}">
              ${icon(it.ic,15)} ${esc(it.label)}
            </button>`).join("")}
        </div>
      </div>`;
  }).join("");
  const usuariosHTML = isAdminLevel(STATE.currentUser) ? `
      <button class="nav-item ${STATE.view==="usuarios"?"active":""}" data-view="usuarios">
        ${icon("users",17)} Usuários
      </button>` : "";
  const semAbasHTML = (!groupHTML && !usuariosHTML) ? `<p class="muted" style="font-size:12px;padding:10px 12px;">Nenhuma aba liberada ainda. Fale com um Admin.</p>` : "";
  sb.innerHTML = `
    <div class="sidebar-brand">${brandMark(34)}</div>
    <nav class="sidebar-nav">${groupHTML}${usuariosHTML}${semAbasHTML}</nav>
    <div class="sidebar-foot">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <div class="avatar">${esc(STATE.currentUser.nome.slice(0,1).toUpperCase())}</div>
        <div style="min-width:0;">
          <p style="margin:0;font-size:12px;font-weight:600;color:#44403c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(STATE.currentUser.nome)}</p>
          <p style="margin:0;font-size:11px;color:#a8a29e;">${esc(CARGO_LABEL[STATE.currentUser.cargo] || STATE.currentUser.cargo)}</p>
        </div>
      </div>
      <button class="btn btn-outline" style="width:100%;" id="btn-logout">${icon("logout",15)} Sair</button>
    </div>`;
  const newNav = sb.querySelector(".sidebar-nav");
  if(newNav) newNav.scrollTop = prevScrollTop;
  sb.querySelectorAll(".nav-group-toggle").forEach(btn=>{
    btn.addEventListener("click", ()=>{ const g=btn.dataset.group; STATE.navOpen[g]=!STATE.navOpen[g]; renderSidebar(); });
  });
  sb.querySelectorAll(".nav-subitem, .nav-item[data-view]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ STATE.view = btn.dataset.view; renderSidebar(); renderView(); });
  });
  document.getElementById("btn-logout").addEventListener("click", async ()=>{
    STATE.session = null; STATE.currentUser = null; STATE.users=[]; STATE.lancamentos=[]; STATE.cartaoLancamentos=[]; STATE.valeLancamentos=[]; STATE.faturamentoLancamentos=[];
    await saveRefreshToken(null);
    renderRoot();
  });
}

function renderSemAcesso(container){
  container.innerHTML = `
    <div class="empty" style="padding:70px 10px;">

      <p style="margin-top:12px;font-size:14px;">Você não tem acesso a esta área.</p>

    </div>`;
}
function renderView(){
  const c = document.getElementById("view-container");
  Object.keys(CHARTS).forEach(k=>{ CHARTS[k].destroy(); delete CHARTS[k]; });
  const autorizado = STATE.view==="usuarios" ? isAdminLevel(STATE.currentUser) : temAcessoView(STATE.currentUser, STATE.view);
  if(!autorizado){ renderSemAcesso(c); return; }
  if(STATE.view==="dashboard") renderDashboard(c);
  else if(STATE.view==="entradas") renderLancamentosView(c,"entrada");
  else if(STATE.view==="saidas") renderLancamentosView(c,"saida");

  else if(STATE.view==="personalizado") renderPersonalizado(c);
  else if(STATE.view==="cartoes-dashboard") renderCartoesDashboard(c);
  else if(STATE.view==="cartoes-lancamentos") renderCartoesLancamentos(c);
  else if(STATE.view==="vales-dashboard") renderValesDashboard(c);
  else if(STATE.view==="vales-lancamentos") renderValesLancamentos(c);
  else if(STATE.view==="fat-dashboard") renderFatDashboard(c);
  else if(STATE.view==="fat-entradas") renderFatLancamentosView(c,"entrada");
  else if(STATE.view==="fat-saidas") renderFatLancamentosView(c,"saida");
  else if(STATE.view==="fat-contas") renderFatContas(c);
  else if(STATE.view==="fat-duplicatas") renderFatDuplicatas(c);
  else if(STATE.view==="fat-personalizado") renderFatPersonalizado(c);
  else if(STATE.view==="usuarios") renderUsuarios(c);
  else renderSemAcesso(c);
}

function wirePeriodoPicker(prefix, container, state, onChange){
  container.querySelector(`#${prefix}-de`).addEventListener("change",(e)=>{ state.de=e.target.value; onChange(); });
  container.querySelector(`#${prefix}-ate`).addEventListener("change",(e)=>{ state.ate=e.target.value; onChange(); });
  container.querySelector(`#${prefix}-todos`).addEventListener("change",(e)=>{ state.todos=e.target.checked; onChange(); });
}
function noPeriodoFn(state, dateOf){
  return (l) => state.todos ? true : ((d)=> d>=state.de && d<=state.ate)(dateOf(l));
}
function badge(status){
  const ok = status==="realizado";
  return `<span class="badge ${ok?"badge-ok":"badge-pending"}"><span class="dot" style="background:${ok?BRAND[500]:"#c9922c"}"></span>${ok?"Realizado":"Previsto"}</span>`;
}
function prazoBadge(l){
  if(!l.data_vencimento) return `<span class="muted" style="font-size:12px;">—</span>`;
  if(l.status==="realizado"){
    const emDia = !l.data_realizada || l.data_realizada<=l.data_vencimento;
    return emDia
      ? `<span class="badge badge-ok"><span class="dot" style="background:${BRAND[500]}"></span>Pago no prazo</span>`
      : `<span class="badge" style="background:${DANGER_BG};color:${DANGER};"><span class="dot" style="background:${DANGER}"></span>Pago com atraso</span>`;
  }
  const atrasado = l.data_vencimento < todayISO();
  return atrasado
    ? `<span class="badge" style="background:${DANGER_BG};color:${DANGER};"><span class="dot" style="background:${DANGER}"></span>Atrasado</span>`
    : `<span class="badge badge-pending"><span class="dot" style="background:#c9922c"></span>No prazo</span>`;
}

          </select></label>
        <label class="field"><span class="field-label" id="f-date-label">${status==="realizado"?"Data de realização":"Data prevista"}</span>
          <input class="input" type="date" id="f-data" value="${status==="realizado" ? (item?.data_realizada||todayISO()) : (item?.data_prevista||todayISO())}" required /></label>
      </div>
      <label class="field"><span class="field-label">Observação (opcional)</span>
        <textarea class="input" id="f-obs" rows="2" placeholder="Detalhes do lançamento...">${esc(item?item.observacao:"")}</textarea></label>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;">
        <button type="button" class="btn btn-outline" id="f-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="f-submit">${icon("check",15)} Salvar lançamento</button>

}
function openLancamentoModal(tipo, item, onSaved){
  const isEdit = !!item;
  openModal({
    title: isEdit ? "Editar lançamento" : `Nova ${tipo==="entrada"?"entrada":"saída"}`,
    bodyHTML: lancamentoFormHTML(tipo, item),
    mount: (body)=>{
      const statusSel = body.querySelector("#f-status");
      statusSel.addEventListener("change", ()=>{
        const lbl = body.querySelector("#f-date-label");
        lbl.textContent = statusSel.value==="realizado" ? "Data de realização" : "Data prevista";
      });
      body.querySelector("#f-cancel").addEventListener("click", closeModal);
      const gerenciarBtn = body.querySelector("#btn-gerenciar-cat");
      if(gerenciarBtn) gerenciarBtn.addEventListener("click", (e)=>{
        e.preventDefault();
        openCategoriasModal(tipo, ()=>{
          const sel = body.querySelector("#f-categoria");
          const atual = sel.value;
          sel.innerHTML = catsFor(tipo).map(c=>`<option value="${esc(c)}" ${c===atual?"selected":""}>${esc(c)}</option>`).join("");
        });
      });
      body.querySelector("#lanc-form").addEventListener("submit", async (e)=>{
        e.preventDefault();
        const valor = parseFloat(body.querySelector("#f-valor").value);
        const contraparte = body.querySelector("#f-contraparte").value.trim();
        const unidade = body.querySelector("#f-unidade").value.trim();
        if(!valor || valor<=0 || !contraparte || !unidade) return;
        const status = body.querySelector("#f-status").value;
        const data = body.querySelector("#f-data").value || todayISO();
        const payload = {
          tipo, valor, categoria: body.querySelector("#f-categoria").value, contraparte, unidade,
          status, data_prevista: status==="realizado" ? (item?.data_prevista||data) : data,
          data_realizada: status==="realizado" ? data : null,
          observacao: body.querySelector("#f-obs").value.trim(),
        };
        const btn = body.querySelector("#f-submit");
        btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Salvando...`;
        try{
          if(isEdit) await editLancamento(item.id, payload);
          else await addLancamento(payload);
          closeModal();
          onSaved && onSaved();
        }catch(err){ toast(err.message, true); btn.disabled=false; btn.innerHTML = `${icon("check",15)} Salvar lançamento`; }
      });
    }
  });
}

function renderLancamentosView(container, tipo){
  const isEntrada = tipo==="entrada";
  const categorias = catsFor(tipo);
  const contraLabel = isEntrada ? "Origem" : "Destino";
  const unidades = Array.from(new Set(STATE.lancamentos.map(l=>l.unidade))).sort();

  const filters = { busca:"", de:"", ate:"", unidade:"", categoria:"", status:"" };

  container.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
      <div>
        <h2 class="serif" style="margin:0;font-size:24px;color:${BRAND[800]};">${isEntrada?"Entradas":"Saídas"}</h2>
        <p class="muted" style="margin:4px 0 0;font-size:13px;" id="lanc-summary"></p>
      </div>

      <div><span class="field-label">Buscar por nome</span>

          <span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#a8a29e;">${icon("search",14)}</span>
          <input class="input" style="padding-left:30px;" id="fl-busca" placeholder="Buscar ${contraLabel.toLowerCase()} ou observação" />
        </div>
      </div>
      <div><span class="field-label">De</span><input class="input" type="date" id="fl-de" /></div>
      <div><span class="field-label">Até</span><input class="input" type="date" id="fl-ate" /></div>
      <div><span class="field-label">Unidade</span>
        <select class="input" id="fl-unidade"><option value="">Todas</option>${unidades.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join("")}</select></div>
      <div><span class="field-label">Categoria</span>
        <select class="input" id="fl-categoria"><option value="">Todas</option>${categorias.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>
      <div><span class="field-label">Status</span>

    </div>
    <div id="lanc-results"></div>`;

  function refresh(){
    const dados = STATE.lancamentos.filter(l=>l.tipo===tipo).filter(l=>{
      const dataRef = l.data_realizada || l.data_prevista;
      if(filters.busca){ const alvo = `${l.contraparte} ${l.observacao}`.toLowerCase(); if(!alvo.includes(filters.busca.toLowerCase())) return false; }
      if(filters.de && dataRef < filters.de) return false;
      if(filters.ate && dataRef > filters.ate) return false;
      if(filters.unidade && l.unidade!==filters.unidade) return false;
      if(filters.categoria && l.categoria!==filters.categoria) return false;
      if(filters.status && l.status!==filters.status) return false;
      return true;
    }).sort((a,b)=> (b.data_realizada||b.data_prevista).localeCompare(a.data_realizada||a.data_prevista));

    const total = dados.reduce((s,l)=> s + (l.status==="realizado"?l.valor:0), 0);
    document.getElementById("lanc-summary").innerHTML = `${dados.length} lançamento(s) · Total realizado: <b style="color:${isEntrada?BRAND[600]:DANGER};">${currency(total)}</b>`;

    const rows = document.getElementById("lanc-results");
    rows.innerHTML = `
      <div class="card" style="overflow:hidden;">
        <table>
          <thead><tr>
            <th>Data</th><th>Status</th><th>Categoria</th><th>${contraLabel}</th><th>Unidade</th>
            <th style="text-align:right;">Valor</th><th>Lançado por</th><th style="text-align:right;">Ações</th>
          </tr></thead>
          <tbody>
            ${dados.map(l=>`
              <tr>
                <td style="white-space:nowrap;">${fmtDate(l.data_realizada||l.data_prevista)}</td>
                <td>${badge(l.status)}</td>
                <td style="color:#57534e;">${esc(l.categoria)}</td>
                <td style="font-weight:500;color:#44403c;">${esc(l.contraparte)}</td>
                <td style="color:#78716c;">${esc(l.unidade)}</td>
                <td style="text-align:right;font-weight:600;color:${isEntrada?BRAND[600]:DANGER};">${currency(l.valor)}</td>
                <td style="color:#a8a29e;font-size:12px;">${esc(l.usuario_nome)}</td>
                <td>
                  <div style="display:flex;justify-content:flex-end;gap:2px;">
                    <button class="icon-btn edit-btn" data-id="${l.id}">${icon("edit",15,"#78716c")}</button>
                    <button class="icon-btn danger del-btn" data-id="${l.id}">${icon("trash",15,DANGER)}</button>
                  </div>
                </td>
              </tr>`).join("") || `<tr><td colspan="8" class="empty">Nenhum lançamento encontrado para os filtros aplicados.</td></tr>`}
          </tbody>
        </table>
      </div>`;

    rows.querySelectorAll(".edit-btn").forEach(b=> b.addEventListener("click", ()=>{
      const item = STATE.lancamentos.find(l=>l.id===b.dataset.id);
      openLancamentoModal(tipo, item, refresh);
    }));
    rows.querySelectorAll(".del-btn").forEach(b=> b.addEventListener("click", ()=>{
      const item = STATE.lancamentos.find(l=>l.id===b.dataset.id);
      openConfirm(`Excluir o lançamento de ${currency(item.valor)} referente a "${item.contraparte}"? Essa ação não pode ser desfeita.`, async ()=>{
        try{ await deleteLancamento(item.id); refresh(); }catch(err){ toast(err.message, true); }
      });
    }));
  }

  container.querySelector("#btn-novo-lanc").addEventListener("click", ()=> openLancamentoModal(tipo, null, refresh));
  ["busca","de","ate","unidade","categoria","status"].forEach(k=>{
    const el = container.querySelector(`#fl-${k}`);
    el.addEventListener(k==="busca"?"input":"change", ()=>{ filters[k]=el.value; refresh(); });
  });
  refresh();
}

function renderContas(container){

  function build(){
    const pagar = STATE.lancamentos.filter(l=>l.tipo==="saida" && l.status==="previsto").sort((a,b)=>a.data_prevista.localeCompare(b.data_prevista));
    const receber = STATE.lancamentos.filter(l=>l.tipo==="entrada" && l.status==="previsto").sort((a,b)=>a.data_prevista.localeCompare(b.data_prevista));

        </div>
        <div style="max-height:540px;overflow-y:auto;">
          ${itens.map(l=>{
            const atrasado = l.data_prevista < hoje;
            return `<div class="list-row">
              <div style="min-width:0;">
                <p style="margin:0;font-size:14px;font-weight:500;color:#44403c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(l.contraparte)}</p>
                <p style="margin:2px 0 0;font-size:12px;color:#a8a29e;">${esc(l.categoria)} · ${esc(l.unidade)}</p>

              </div>
              <div style="text-align:right;flex-shrink:0;">
                <p style="margin:0;font-size:14px;font-weight:600;color:${cor};">${currency(l.valor)}</p>
                <button class="quitar-btn" data-id="${l.id}" style="border:none;background:none;font-size:11px;margin-top:2px;color:${BRAND[600]};text-decoration:underline;cursor:pointer;">${acaoLabel}</button>
              </div>
            </div>`;
          }).join("") || `<p class="empty">Nada por aqui. Tudo em dia!</p>`}
        </div>
      </div>`;
    container.innerHTML = `
      <h2 class="serif" style="margin:0 0 4px;font-size:24px;color:${BRAND[800]};">Contas a Pagar e a Receber</h2>
      <p class="muted" style="margin:0 0 18px;font-size:13px;">Lançamentos previstos que ainda não foram confirmados.</p>
      <div style="display:flex;flex-direction:column;gap:14px;" class="contas-flex">
        ${lista("Contas a Pagar", pagar, DANGER, "Marcar como pago")}
        ${lista("Contas a Receber", receber, BRAND[600], "Marcar como recebido")}
      </div>
      <style>@media(min-width:900px){.contas-flex{flex-direction:row !important;}}</style>`;
    container.querySelectorAll(".quitar-btn").forEach(b=> b.addEventListener("click", async ()=>{
      try{ await quitarConta(b.dataset.id); build(); }catch(err){ toast(err.message, true); }
    }));
  }
  build();
}

/* ============================== Dashboard ============================== */
function renderDashboard(container){
  const periodoState = defaultPeriodoState();

  function build(){
    const noPeriodo = noPeriodoFn(periodoState, l=>l.data_realizada||l.data_prevista);
    const entradasR = STATE.lancamentos.filter(l=>l.tipo==="entrada" && l.status==="realizado" && noPeriodo(l));
    const saidasR = STATE.lancamentos.filter(l=>l.tipo==="saida" && l.status==="realizado" && noPeriodo(l));
    const totalEntradas = entradasR.reduce((s,l)=>s+l.valor,0);
    const totalSaidas = saidasR.reduce((s,l)=>s+l.valor,0);
    const saldo = totalEntradas - totalSaidas;
    const previstoEntradas = STATE.lancamentos.filter(l=>l.tipo==="entrada" && noPeriodo(l)).reduce((s,l)=>s+l.valor,0);
    const previstoSaidas = STATE.lancamentos.filter(l=>l.tipo==="saida" && noPeriodo(l)).reduce((s,l)=>s+l.valor,0);

    const porCategoria = {}; saidasR.forEach(l=>{ porCategoria[l.categoria]=(porCategoria[l.categoria]||0)+l.valor; });
    const topCategorias = Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const porUnidade = {}; entradasR.forEach(l=>{ porUnidade[l.unidade]=(porUnidade[l.unidade]||0)+l.valor; });
    const topUnidades = Object.entries(porUnidade).sort((a,b)=>b[1]-a[1]).slice(0,5);

    const pagarPend = STATE.lancamentos.filter(l=>l.tipo==="saida"&&l.status==="previsto").sort((a,b)=>a.data_prevista.localeCompare(b.data_prevista)).slice(0,4);
    const receberPend = STATE.lancamentos.filter(l=>l.tipo==="entrada"&&l.status==="previsto").sort((a,b)=>a.data_prevista.localeCompare(b.data_prevista)).slice(0,4);

    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
        <div>
          <h2 class="serif" style="margin:0;font-size:24px;color:${BRAND[800]};">Dashboard Financeiro</h2>
          <p class="muted" style="margin:4px 0 0;font-size:13px;">Visão geral de entradas, saídas e fluxo de caixa da Paulu's.</p>
        </div>
        ${periodoPickerHTML("db", periodoState)}
      </div>

      <div class="grid-4" style="margin-bottom:16px;">
        ${statCard("Entradas realizadas", currency(totalEntradas), "down", BRAND[100], BRAND[600])}
        ${statCard("Saídas realizadas", currency(totalSaidas), "up", DANGER_BG, DANGER)}
        ${statCard("Saldo do período", currency(saldo), "trending", saldo>=0?BRAND[100]:DANGER_BG, saldo>=0?BRAND[600]:DANGER)}
        ${statCard("Total previsto pendente", currency((previstoEntradas-totalEntradas)+(previstoSaidas-totalSaidas)), "clipboard", WARN_BG, WARN)}
      </div>

      <div class="grid-3" style="margin-bottom:16px;">
        <div class="card" style="padding:16px;">
          <h3 class="serif" style="margin:0 0 10px;font-size:15px;color:${BRAND[800]};">Fluxo de Caixa: Previsto vs. Realizado</h3>
          <canvas id="chart-fluxo" height="200"></canvas>
        </div>
        <div class="card" style="padding:16px;">
          <h3 class="serif" style="margin:0 0 10px;font-size:15px;color:${BRAND[800]};">Categorias que mais consumiram</h3>
          ${topCategorias.length ? `<canvas id="chart-cat" height="200"></canvas>` : `<p class="empty">Sem saídas realizadas no período.</p>`}
        </div>
        <div class="card" style="padding:16px;">
          <h3 class="serif" style="margin:0 0 10px;font-size:15px;color:${BRAND[800]};">Unidades com mais recebimento</h3>
          ${topUnidades.length ? `<canvas id="chart-uni" height="200"></canvas>` : `<p class="empty">Sem entradas realizadas no período.</p>`}
        </div>
      </div>

      <div class="grid-2">
        <div class="card" style="padding:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <h3 class="serif" style="margin:0;font-size:15px;color:${BRAND[800]};">Próximas contas a pagar</h3>${icon("chevron",16,"#d6d3cd")}
          </div>
          ${pagarPend.map(l=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #faf9f6;font-size:14px;"><span style="color:#57534e;">${esc(l.contraparte)}</span><span style="font-weight:500;color:${DANGER};">${currency(l.valor)}</span></div>`).join("") || `<p class="muted" style="font-size:13px;padding:10px 0;">Nenhuma pendência.</p>`}
        </div>
        <div class="card" style="padding:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <h3 class="serif" style="margin:0;font-size:15px;color:${BRAND[800]};">Próximas contas a receber</h3>${icon("chevron",16,"#d6d3cd")}
          </div>
          ${receberPend.map(l=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #faf9f6;font-size:14px;"><span style="color:#57534e;">${esc(l.contraparte)}</span><span style="font-weight:500;color:${BRAND[600]};">${currency(l.valor)}</span></div>`).join("") || `<p class="muted" style="font-size:13px;padding:10px 0;">Nenhuma pendência.</p>`}
        </div>
      </div>`;

    wirePeriodoPicker("db", container, periodoState, build);

    mkBarChart("chart-fluxo", ["Entradas","Saídas"], [
      {label:"Previsto", data:[previstoEntradas, previstoSaidas], color:BRAND[200]},
      {label:"Realizado", data:[totalEntradas, totalSaidas], color:BRAND[600]},
    ], true);
    if(topCategorias.length) mkHBarChart("chart-cat", topCategorias);
    if(topUnidades.length) mkHBarChart("chart-uni", topUnidades);
  }
  build();
}

function mkBarChart(canvasId, labels, datasets, legend){
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  if(CHARTS[canvasId]) CHARTS[canvasId].destroy();
  CHARTS[canvasId] = new Chart(ctx, {
    type:"bar",
    data:{ labels, datasets: datasets.map(d=>({label:d.label, data:d.data, backgroundColor:d.color, borderRadius:5, maxBarThickness:38})) },
    options:{ responsive:true, plugins:{ legend:{display:!!legend, labels:{boxWidth:10,font:{size:11}}}, tooltip:{callbacks:{label:(c)=>currency(c.raw)}} },
      scales:{ x:{grid:{display:false}}, y:{ticks:{callback:(v)=> (v/1000)+"k"}, grid:{color:"#f1efe9"}} } }
  });
}
function mkHBarChart(canvasId, entries){
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  if(CHARTS[canvasId]) CHARTS[canvasId].destroy();
  const palette=[BRAND[600],BRAND[500],BRAND[400],BRAND[200],"#dfeee5"];
  CHARTS[canvasId] = new Chart(ctx, {
    type:"bar",
    data:{ labels: entries.map(e=>e[0]), datasets:[{ data: entries.map(e=>e[1]), backgroundColor: entries.map((_,i)=>palette[i%palette.length]), borderRadius:5 }] },
    options:{ indexAxis:"y", responsive:true, plugins:{ legend:{display:false}, tooltip:{callbacks:{label:(c)=>currency(c.raw)}} },
      scales:{ x:{display:false}, y:{grid:{display:false}, ticks:{font:{size:11}}} } }
  });
}

/* ============================== Análise Personalizada ============================== */
function renderPersonalizado(container){
  let modo = "categoria";
  let valorSel = "";

  function build(){
    const set = new Set(); STATE.lancamentos.forEach(l=> set.add(modo==="categoria"?l.categoria:l.contraparte));
    const opcoes = Array.from(set).sort();
    const filtrados = valorSel ? STATE.lancamentos.filter(l=> (modo==="categoria"?l.categoria:l.contraparte)===valorSel) : [];
    const entradas = filtrados.filter(l=>l.tipo==="entrada"&&l.status==="realizado").reduce((s,l)=>s+l.valor,0);
    const saidas = filtrados.filter(l=>l.tipo==="saida"&&l.status==="realizado").reduce((s,l)=>s+l.valor,0);

    const porMes = {};
    filtrados.forEach(l=>{ if(l.status!=="realizado") return; const mk=monthKey(l.data_realizada); porMes[mk]=porMes[mk]||0; porMes[mk]+= l.tipo==="entrada"?l.valor:-l.valor; });
    const serieKeys = Object.keys(porMes).sort();

    container.innerHTML = `
      <h2 class="serif" style="margin:0 0 4px;font-size:24px;color:${BRAND[800]};">Análise Personalizada</h2>
      <p class="muted" style="margin:0 0 18px;font-size:13px;">Filtre por categoria ou por cliente/fornecedor específico para ver um recorte dedicado.</p>
      <div class="card" style="padding:14px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;">
        <div><span class="field-label">Analisar por</span>
          <select class="input" id="pz-modo" style="width:auto;"><option value="categoria" ${modo==="categoria"?"selected":""}>Categoria</option><option value="contraparte" ${modo==="contraparte"?"selected":""}>Cliente / Fornecedor</option></select></div>
        <div style="flex:1;min-width:220px;"><span class="field-label">${modo==="categoria"?"Categoria":"Nome"}</span>
          <select class="input" id="pz-valor"><option value="">Selecione...</option>${opcoes.map(o=>`<option value="${esc(o)}" ${o===valorSel?"selected":""}>${esc(o)}</option>`).join("")}</select></div>
      </div>
      <div id="pz-results">
        ${!valorSel ? `<div class="card empty" style="border-style:dashed;padding:60px 10px;">Selecione uma categoria ou um cliente/fornecedor acima para gerar a análise.</div>` : `
        <div class="grid-4" style="margin-bottom:16px;">
          ${statCard("Total recebido", currency(entradas), "down", BRAND[100], BRAND[600])}
          ${statCard("Total gasto", currency(saidas), "up", DANGER_BG, DANGER)}
          ${statCard("Saldo líquido", currency(entradas-saidas), "trending", BRAND[100], BRAND[600])}
          ${statCard("Lançamentos", filtrados.length, "clipboard", WARN_BG, WARN)}
        </div>
        <div class="card" style="padding:16px;margin-bottom:16px;">
          <h3 class="serif" style="margin:0 0 10px;font-size:15px;color:${BRAND[800]};">Evolução mensal (líquido)</h3>
          ${serieKeys.length ? `<canvas id="chart-pz" height="180"></canvas>` : `<p class="empty">Sem lançamentos realizados para esse recorte.</p>`}
        </div>
        <div class="card" style="overflow:hidden;">
          <table><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Contraparte</th><th>Unidade</th><th style="text-align:right;">Valor</th></tr></thead>
          <tbody>${filtrados.sort((a,b)=>(b.data_realizada||b.data_prevista).localeCompare(a.data_realizada||a.data_prevista)).map(l=>`
            <tr><td>${fmtDate(l.data_realizada||l.data_prevista)}</td><td>${l.tipo==="entrada"?"Entrada":"Saída"}</td>
            <td style="color:#78716c;">${esc(l.categoria)}</td><td style="font-weight:500;">${esc(l.contraparte)}</td><td style="color:#78716c;">${esc(l.unidade)}</td>
            <td style="text-align:right;font-weight:600;color:${l.tipo==="entrada"?BRAND[600]:DANGER};">${currency(l.valor)}</td></tr>`).join("")}</tbody></table>
        </div>`}
      </div>`;

    container.querySelector("#pz-modo").addEventListener("change",(e)=>{ modo=e.target.value; valorSel=""; build(); });
    const valSel = container.querySelector("#pz-valor");
    if(valSel) valSel.addEventListener("change",(e)=>{ valorSel=e.target.value; build(); });

    if(valorSel && serieKeys.length){
      const ctx = document.getElementById("chart-pz");
      if(CHARTS["chart-pz"]) CHARTS["chart-pz"].destroy();
      CHARTS["chart-pz"] = new Chart(ctx, {
        type:"line",
        data:{ labels: serieKeys.map(monthLabel), datasets:[{ data: serieKeys.map(k=>porMes[k]), borderColor:BRAND[600], backgroundColor:BRAND[100], fill:true, tension:.35, pointRadius:3 }] },
        options:{ plugins:{legend:{display:false}, tooltip:{callbacks:{label:(c)=>currency(c.raw)}}}, scales:{ y:{ticks:{callback:(v)=>(v/1000)+"k"}, grid:{color:"#f1efe9"}}, x:{grid:{display:false}} } }
      });
    }
  }
  build();
}

function openCartaoCompraModal(onSaved){
  openModal({
    title:"Novo gasto no cartão",
    bodyHTML: cartaoCompraFormHTML(),
    mount:(body)=>{
      const parceladoSel = body.querySelector("#cf-parcelado");
      const nparcelasWrap = body.querySelector("#cf-nparcelas-wrap");
      const hint = body.querySelector("#cf-parcela-hint");
      const dataLabel = body.querySelector("#cf-data-label");
      parceladoSel.addEventListener("change", ()=>{
        const sim = parceladoSel.value==="sim";
        nparcelasWrap.style.display = sim ? "block" : "none";
        hint.style.display = sim ? "block" : "none";
        dataLabel.textContent = sim ? "Data da 1ª parcela" : "Data da compra";
      });
      body.querySelector("#cf-cancel").addEventListener("click", closeModal);
      const gerenciarBtnCf = body.querySelector("#btn-gerenciar-cat");
      if(gerenciarBtnCf) gerenciarBtnCf.addEventListener("click", (e)=>{
        e.preventDefault();
        openCategoriasModal("cartao", ()=>{
          const sel = body.querySelector("#cf-categoria");
          const atual = sel.value;
          sel.innerHTML = catsFor("cartao").map(c=>`<option value="${esc(c)}" ${c===atual?"selected":""}>${esc(c)}</option>`).join("");
        });
      });
      body.querySelector("#cartao-form").addEventListener("submit", async (e)=>{
        e.preventDefault();
        const valorTotal = parseFloat(body.querySelector("#cf-valor").value);
        const descricao = body.querySelector("#cf-descricao").value.trim();
        const cartao = body.querySelector("#cf-cartao").value.trim();
        const portador = body.querySelector("#cf-portador").value.trim();
        if(!valorTotal || valorTotal<=0 || !descricao || !cartao || !portador) return;
        const parcelasTotal = parceladoSel.value==="sim" ? Math.max(2, parseInt(body.querySelector("#cf-nparcelas").value,10)||2) : 1;
        const btn = body.querySelector("#cf-submit");
        btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Salvando...`;
        try{
          await addCartaoCompra({
            descricao, categoria: body.querySelector("#cf-categoria").value, cartao, portador,
            valorTotal, parcelasTotal, dataPrimeira: body.querySelector("#cf-data").value || todayISO(),
            observacao: body.querySelector("#cf-obs").value.trim(),
          });
          closeModal(); onSaved && onSaved();
        }catch(err){ toast(err.message, true); btn.disabled=false; btn.innerHTML = `${icon("check",15)} Salvar gasto`; }
      });
    }
  });
}

function renderCartoesDashboard(container){

      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;">

function openFatLancamentoModal(tipo, item, onSaved){
  const isEdit = !!item;
  openModal({
    title: isEdit ? "Editar lançamento" : `Nova ${tipo==="entrada"?"entrada":"saída"} de faturamento`,
    bodyHTML: fatLancamentoFormHTML(tipo, item),
    mount: (body)=>{
      const statusSel = body.querySelector("#ff-status");
      statusSel.addEventListener("change", ()=>{
        const lbl = body.querySelector("#ff-date-label");
        lbl.textContent = statusSel.value==="realizado" ? "Data de realização" : "Data prevista";
      });
      body.querySelector("#ff-cancel").addEventListener("click", closeModal);
      const dupCheck = body.querySelector("#ff-duplicata");
      if(dupCheck) dupCheck.addEventListener("change", ()=>{
        body.querySelector("#ff-numero-wrap").style.display = dupCheck.checked ? "block" : "none";
      });
      const gerenciarBtn = body.querySelector("#btn-gerenciar-cat");
      if(gerenciarBtn) gerenciarBtn.addEventListener("click", (e)=>{
        e.preventDefault();
        openCategoriasModal("fat_"+tipo, ()=>{
          const sel = body.querySelector("#ff-categoria");
          const atual = sel.value;
          sel.innerHTML = catsForFat(tipo).map(c=>`<option value="${esc(c)}" ${c===atual?"selected":""}>${esc(c)}</option>`).join("");
        });
      });
      body.querySelector("#fat-lanc-form").addEventListener("submit", async (e)=>{
        e.preventDefault();
        const valor = parseFloat(body.querySelector("#ff-valor").value);
        const contraparte = body.querySelector("#ff-contraparte").value.trim();
        const unidade = body.querySelector("#ff-unidade").value.trim();
        if(!valor || valor<=0 || !contraparte || !unidade) return;
        const status = body.querySelector("#ff-status").value;
        const data = body.querySelector("#ff-data").value || todayISO();
        const duplicata = tipo==="saida" && !!(body.querySelector("#ff-duplicata") && body.querySelector("#ff-duplicata").checked);
        const numeroDuplicata = duplicata ? body.querySelector("#ff-numero-duplicata").value.trim() : null;
        const vencimentoEl = body.querySelector("#ff-vencimento");
        const dataVencimento = tipo==="entrada" ? (vencimentoEl && vencimentoEl.value ? vencimentoEl.value : null) : null;
        const payload = {
          tipo, valor, categoria: body.querySelector("#ff-categoria").value, contraparte, unidade,
          status, data_prevista: status==="realizado" ? (item?.data_prevista||data) : data,
          data_realizada: status==="realizado" ? data : null,
          data_vencimento: dataVencimento,
          duplicata, numero_duplicata: numeroDuplicata,
          observacao: body.querySelector("#ff-obs").value.trim(),
        };
        const btn = body.querySelector("#ff-submit");
        btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Salvando...`;
        try{
          if(isEdit) await editFatLancamento(item.id, payload);
          else await addFatLancamento(payload);
          closeModal();
          onSaved && onSaved();
        }catch(err){ toast(err.message, true); btn.disabled=false; btn.innerHTML = `${icon("check",15)} Salvar lançamento`; }
      });
    }
  });
}

    const categorias = Array.from(new Set(todas.map(l=>l.categoria))).sort();

    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
        <div>
          <h2 class="serif" style="margin:0;font-size:24px;color:${BRAND[800]};">Duplicatas a Pagar</h2>
          <p class="muted" style="margin:4px 0 0;font-size:13px;" id="dup-summary"></p>
        </div>
      </div>
      <div class="filter-bar">
        <div><span class="field-label">Buscar</span>
          <div style="position:relative;">
            <span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#a8a29e;">${icon("search",14)}</span>
            <input class="input" style="padding-left:30px;" id="dup-busca" placeholder="Fornecedor ou nº da duplicata" />
          </div>
        </div>
        <div><span class="field-label">Vencimento de</span><input class="input" type="date" id="dup-de" /></div>
        <div><span class="field-label">Vencimento até</span><input class="input" type="date" id="dup-ate" /></div>
        <div><span class="field-label">Unidade</span>
          <select class="input" id="dup-unidade"><option value="">Todas</option>${unidades.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join("")}</select></div>
        <div><span class="field-label">Categoria</span>
          <select class="input" id="dup-categoria"><option value="">Todas</option>${categorias.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>
        <div><span class="field-label">Status</span>
          <select class="input" id="dup-status"><option value="">Todos</option><option value="previsto">Em aberto</option><option value="realizado">Pago</option></select></div>
      </div>
      <div id="dup-results"></div>
      <p class="field-hint" style="margin-top:10px;">Para marcar uma saída como duplicata, use o campo "É uma duplicata?" ao criar ou editar um lançamento em Faturamentos → Saídas.</p>`;

    ["busca","de","ate","unidade","categoria","status"].forEach(k=>{
      const el = container.querySelector(`#dup-${k}`);
      el.value = filters[k];
      el.addEventListener(k==="busca"?"input":"change", ()=>{ filters[k]=el.value; refresh(); });
    });

    refresh();
  }

  function refresh(){
    const duplicatas = STATE.faturamentoLancamentos.filter(l=>l.tipo==="saida" && l.duplicata).filter(l=>{
      if(filters.busca){ const alvo = `${l.contraparte} ${l.numero_duplicata||""}`.toLowerCase(); if(!alvo.includes(filters.busca.toLowerCase())) return false; }
      if(filters.de && l.data_prevista < filters.de) return false;
      if(filters.ate && l.data_prevista > filters.ate) return false;
      if(filters.unidade && l.unidade!==filters.unidade) return false;
      if(filters.categoria && l.categoria!==filters.categoria) return false;
      if(filters.status && l.status!==filters.status) return false;
      return true;
    }).sort((a,b)=>a.data_prevista.localeCompare(b.data_prevista));

    const totalAberto = duplicatas.filter(l=>l.status==="previsto").reduce((s,l)=>s+l.valor,0);
    document.getElementById("dup-summary").innerHTML = `${duplicatas.length} duplicata(s) encontrada(s) · Em aberto: <b style="color:${DANGER};">${currency(totalAberto)}</b>`;

    const rows = document.getElementById("dup-results");
    rows.innerHTML = `
      <div class="card" style="overflow:hidden;">
        <table>
          <thead><tr><th>Vencimento</th><th>Status</th><th>Nº Duplicata</th><th>Fornecedor</th><th>Categoria</th><th>Unidade</th><th style="text-align:right;">Valor</th><th style="text-align:right;">Ações</th></tr></thead>
          <tbody>
            ${duplicatas.map(l=>{
              const atrasado = l.status==="previsto" && l.data_prevista < hoje;
              return `<tr>
                <td style="white-space:nowrap;${atrasado?`color:${DANGER};font-weight:600;`:""}">${fmtDate(l.data_prevista)}</td>
                <td>${badge(l.status)}</td>
                <td style="color:#78716c;">${esc(l.numero_duplicata||"—")}</td>
                <td style="font-weight:500;color:#44403c;">${esc(l.contraparte)}</td>
                <td style="color:#78716c;">${esc(l.categoria)}</td>
                <td style="color:#78716c;">${esc(l.unidade)}</td>
                <td style="text-align:right;font-weight:600;color:${DANGER};">${currency(l.valor)}</td>
                <td style="text-align:right;">${l.status==="previsto" ? `<button class="quitar-dup-btn" data-id="${l.id}" style="border:none;background:none;font-size:11px;color:${BRAND[600]};text-decoration:underline;cursor:pointer;">Marcar como pago</button>` : ""}</td>
              </tr>`;
            }).join("") || `<tr><td colspan="8" class="empty">Nenhuma duplicata encontrada para os filtros aplicados.</td></tr>`}
          </tbody>
        </table>
      </div>`;

    rows.querySelectorAll(".quitar-dup-btn").forEach(b=> b.addEventListener("click", async ()=>{
      try{ await quitarFatConta(b.dataset.id); refresh(); }catch(err){ toast(err.message, true); }
    }));
  }

  build();
}

function renderFatPersonalizado(container){
  let modo = "categoria";
  let valorSel = "";

  function build(){
    const set = new Set(); STATE.faturamentoLancamentos.forEach(l=> set.add(modo==="categoria"?l.categoria:l.contraparte));
    const opcoes = Array.from(set).sort();
    const filtrados = valorSel ? STATE.faturamentoLancamentos.filter(l=> (modo==="categoria"?l.categoria:l.contraparte)===valorSel) : [];
    const entradas = filtrados.filter(l=>l.tipo==="entrada"&&l.status==="realizado").reduce((s,l)=>s+l.valor,0);
    const saidas = filtrados.filter(l=>l.tipo==="saida"&&l.status==="realizado").reduce((s,l)=>s+l.valor,0);

    const porMes = {};
    filtrados.forEach(l=>{ if(l.status!=="realizado") return; const mk=monthKey(l.data_realizada); porMes[mk]=porMes[mk]||0; porMes[mk]+= l.tipo==="entrada"?l.valor:-l.valor; });
    const serieKeys = Object.keys(porMes).sort();

    container.innerHTML = `
      <h2 class="serif" style="margin:0 0 4px;font-size:24px;color:${BRAND[800]};">Faturamentos — Análise Personalizada</h2>
      <p class="muted" style="margin:0 0 18px;font-size:13px;">Filtre por categoria ou por cliente/fornecedor específico para ver um recorte dedicado.</p>
      <div class="card" style="padding:14px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;">

          <select class="input" id="fpz-modo" style="width:auto;"><option value="categoria" ${modo==="categoria"?"selected":""}>Categoria</option><option value="contraparte" ${modo==="contraparte"?"selected":""}>Cliente / Fornecedor</option></select></div>

      </div>
      <div id="fpz-results">
        ${!valorSel ? `<div class="card empty" style="border-style:dashed;padding:60px 10px;">Selecione uma categoria ou um cliente/fornecedor acima para gerar a análise.</div>` : `
        <div class="grid-4" style="margin-bottom:16px;">
          ${statCard("Total recebido", currency(entradas), "down", BRAND[100], BRAND[600])}
          ${statCard("Total gasto", currency(saidas), "up", DANGER_BG, DANGER)}
          ${statCard("Saldo líquido", currency(entradas-saidas), "trending", BRAND[100], BRAND[600])}
          ${statCard("Lançamentos", filtrados.length, "clipboard", WARN_BG, WARN)}
        </div>
        <div class="card" style="padding:16px;margin-bottom:16px;">
          <h3 class="serif" style="margin:0 0 10px;font-size:15px;color:${BRAND[800]};">Evolução mensal (líquido)</h3>
          ${serieKeys.length ? `<canvas id="chart-fat-pz" height="180"></canvas>` : `<p class="empty">Sem lançamentos realizados para esse recorte.</p>`}
        </div>
        <div class="card" style="overflow:hidden;">
          <table><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Contraparte</th><th>Unidade</th><th style="text-align:right;">Valor</th></tr></thead>
          <tbody>${filtrados.sort((a,b)=>(b.data_realizada||b.data_prevista).localeCompare(a.data_realizada||a.data_prevista)).map(l=>`
            <tr><td>${fmtDate(l.data_realizada||l.data_prevista)}</td><td>${l.tipo==="entrada"?"Entrada":"Saída"}</td>
            <td style="color:#78716c;">${esc(l.categoria)}</td><td style="font-weight:500;">${esc(l.contraparte)}</td><td style="color:#78716c;">${esc(l.unidade)}</td>
            <td style="text-align:right;font-weight:600;color:${l.tipo==="entrada"?BRAND[600]:DANGER};">${currency(l.valor)}</td></tr>`).join("")}</tbody></table>
        </div>`}
      </div>`;

    container.querySelector("#fpz-modo").addEventListener("change",(e)=>{ modo=e.target.value; valorSel=""; build(); });
    const valSel = container.querySelector("#fpz-valor");
    if(valSel) valSel.addEventListener("change",(e)=>{ valorSel=e.target.value; build(); });

    if(valorSel && serieKeys.length){
      const ctx = document.getElementById("chart-fat-pz");
      if(CHARTS["chart-fat-pz"]) CHARTS["chart-fat-pz"].destroy();
      CHARTS["chart-fat-pz"] = new Chart(ctx, {
        type:"line",
        data:{ labels: serieKeys.map(monthLabel), datasets:[{ data: serieKeys.map(k=>porMes[k]), borderColor:BRAND[600], backgroundColor:BRAND[100], fill:true, tension:.35, pointRadius:3 }] },
        options:{ plugins:{legend:{display:false}, tooltip:{callbacks:{label:(c)=>currency(c.raw)}}}, scales:{ y:{ticks:{callback:(v)=>(v/1000)+"k"}, grid:{color:"#f1efe9"}}, x:{grid:{display:false}} } }
      });
    }
  }
  build();
}

function openUsuarioModal(item, onSaved){
  const actingCargo = STATE.currentUser.cargo;
  openModal({
    title: item ? "Editar usuário" : "Novo usuário",
    bodyHTML: usuarioFormHTML(item, actingCargo),
    mount:(body)=>{
      body.querySelector("#uf-cancel").addEventListener("click", closeModal);
      const cargoSel = body.querySelector("#uf-cargo");
      const permWrap = body.querySelector("#uf-permissoes-wrap");
      cargoSel.addEventListener("change", ()=>{ permWrap.style.display = cargoSel.value==="usuario" ? "block" : "none"; });
      body.querySelectorAll(".uf-group-check").forEach(gc=>{
        gc.addEventListener("change", ()=>{
          body.querySelectorAll(`.uf-perm-check[data-group="${gc.dataset.group}"]`).forEach(ic=>{ ic.checked = gc.checked; });
        });
      });
      body.querySelectorAll(".uf-perm-check").forEach(ic=>{
        ic.addEventListener("change", ()=>{
          const grupo = ic.dataset.group;
          const irmaos = body.querySelectorAll(`.uf-perm-check[data-group="${grupo}"]`);
          const gc = body.querySelector(`.uf-group-check[data-group="${grupo}"]`);
          if(gc) gc.checked = Array.from(irmaos).every(s=>s.checked);
        });
      });
      body.querySelector("#user-form").addEventListener("submit", async (e)=>{
        e.preventDefault();
        const nome = body.querySelector("#uf-nome").value.trim();
        const cargo = cargoSel.value;
        const permissoes = cargo==="usuario" ? Array.from(body.querySelectorAll(".uf-perm-check:checked")).map(el=>el.value) : [];
        const btn = body.querySelector("#uf-submit");
        btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Salvando...`;
        try{
          if(item){
            await editarUsuario(item.id, { nome, cargo, permissoes });
            if(item.id===STATE.currentUser.id){ ajustarViewInicial(); renderSidebar(); renderView(); }
          }else{
            const email = body.querySelector("#uf-email").value.trim();
            const senha = body.querySelector("#uf-senha").value;
            if(!email || senha.length < 6) throw new Error("Preencha e-mail e uma senha com pelo menos 6 caracteres.");
            await criarUsuario({ nome, email, senha, cargo, permissoes });
          }
          closeModal(); onSaved && onSaved();
        }catch(err){ toast(err.message, true); btn.disabled=false; btn.innerHTML = `${icon("check",15)} Salvar`; }
      });
    }
  });
}

          return `
          <tr>
            <td style="font-weight:500;color:#44403c;">${esc(u.nome)}${u.id===STATE.currentUser.id?` <span class="muted" style="font-size:10px;">(você)</span>`:""}</td>
            <td>${cargoBadge(u.cargo)}</td>
            <td>${permissoesBadges(u)}</td>
            <td><div style="display:flex;justify-content:flex-end;gap:2px;">
              ${podeEditar ? `<button class="icon-btn edit-user-btn" data-id="${u.id}">${icon("edit",15,"#78716c")}</button>` : `<span class="muted" style="font-size:11px;">—</span>`}
            </div></td>
          </tr>`;
        }).join("")}</tbody></table>
      </div>
      <p class="muted" style="font-size:11px;margin-top:10px;">Remover o acesso de um usuário exige a chave de administração do Supabase (Service Role) e, por segurança, não fica disponível dentro do app — faça isso pelo painel do Supabase em Authentication → Users.</p>`;
    container.querySelector("#btn-novo-user").addEventListener("click", ()=> openUsuarioModal(null, build));
    container.querySelectorAll(".edit-user-btn").forEach(b=> b.addEventListener("click", ()=>{
      openUsuarioModal(STATE.users.find(u=>u.id===b.dataset.id), build);
    }));
  }
  build();
}

/* ============================== Boot ============================== */
bootstrap();
</script>
</body>
</html>
